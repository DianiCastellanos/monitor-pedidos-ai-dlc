<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B21B6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Fondo con esquinas redondeadas -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Letras MP -->
  <text x="32" y="30" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, sans-serif" font-weight="800"
        font-size="22" fill="white" letter-spacing="-1">MP</text>

  <!-- Monitor outline -->
  <rect x="16" y="38" width="32" height="18" rx="3" ry="3"
        fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <line x1="32" y1="56" x2="32" y2="60" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <line x1="24" y1="60" x2="40" y2="60" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

  <!-- Punto verde (status OK) -->
  <circle cx="50" cy="14" r="6" fill="#22c55e"/>
</svg>
